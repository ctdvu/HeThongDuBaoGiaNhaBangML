services:
  - type: web
    name: vietnam-housing-price-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Một worker + preload tránh nạp pandas/scikit-learn/mô hình thành nhiều bản trên gói RAM nhỏ của Render.
    startCommand: gunicorn --workers 1 --threads 2 --preload --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
